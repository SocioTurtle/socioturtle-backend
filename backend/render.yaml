# Render blueprint. Point Render at this repo and it provisions both services.
#
# Secrets (SECRET_KEY, SMTP_PASSWORD) are marked sync:false so they are NOT read
# from this file — set them in the Render dashboard, never in git.
services:
  - type: web
    name: socioturtle-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: socioturtle-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://www.socioturtle.com","https://socioturtle.com"]'
      - key: PUBLIC_APP_URL
        value: https://app.socioturtle.com
      - key: PUBLIC_API_URL
        value: https://api.socioturtle.com
      - key: EMAIL_BACKEND
        value: smtp
      - key: EMAIL_FROM
        value: admin@socioturtle.com
      - key: EMAIL_FROM_NAME
        value: SocioTurtle
      - key: SMTP_HOST
        value: smtp.zoho.in
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: LOG_JSON
        value: "true"
      - key: LOG_FILE
        value: ""

databases:
  - name: socioturtle-db
    plan: free
