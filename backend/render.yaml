# Render blueprint. Point Render at this repo and it provisions both services.
#
# Secrets (SECRET_KEY, RESEND_API_KEY) are marked sync:false so they are NOT
# read from this file — set them in the Render dashboard, never in git.
#
# EMAIL_BACKEND is "resend" (HTTPS API) rather than "smtp": Render's outbound
# network blocks raw SMTP ports (25/465/587) on this plan, which made the SMTP
# backend hang until it timed out. Resend sends over HTTPS instead, so it isn't
# affected. The smtp backend still exists in code if you ever move to a host
# that allows SMTP egress.
services:
  - type: web
    name: socioturtle-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: socioturtle-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://www.socioturtle.com","https://socioturtle.com"]'
      - key: PUBLIC_APP_URL
        value: https://app.socioturtle.com
      - key: PUBLIC_API_URL
        value: https://api.socioturtle.com
      - key: EMAIL_BACKEND
        value: resend
      - key: EMAIL_FROM
        value: admin@socioturtle.com
      - key: EMAIL_FROM_NAME
        value: SocioTurtle
      - key: RESEND_API_KEY
        sync: false
      - key: LOG_JSON
        value: "true"
      - key: LOG_FILE
        value: ""

databases:
  - name: socioturtle-db
    plan: free
